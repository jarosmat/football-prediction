name: nightly-inference

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-container:
    environment: inference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the container
        run: devenv container build shell
      - name: Push the container to registry
        run: devenv container copy shell
