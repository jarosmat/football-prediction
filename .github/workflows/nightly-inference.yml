name: nightly-inference

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull Devenv Image
        run: docker pull ghcr.io/jarosmat/football-prediction-env:latest
      - name: Download model and Run inference
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          API_NINJAS_KEY: ${{ secrets.APININJAS }}
        run: |
          docker run --rm \
                      -v ${{ github.workspace }}:/workspace \
                      -w /workspace \
                      -e GH_TOKEN \
                      -e API_NINJAS_KEY \
                      -e PYTHONPATH=src \
                      --entrypoint /bin/bash \
                      ghcr.io/jarosmat/football-prediction-env:latest \
                      bash -c "git config --global --add safe.directory /workspace && gh release download log_reg_window-v1 --pattern '*.model' --dir . && mkdir -p predictions && python src/models/inference_window_model.py --model log_reg_window_trained.model --output \"predictions/\$(date +%F).csv\""
      - name: Upload predictions as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: predictions-${{ github.run_id }}
          path: predictions/*.csv
          retention-days: 90
