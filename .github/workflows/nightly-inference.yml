name: nightly-inference

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  predict:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv shell -- bash -e {0}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      #      - uses: cachix/cachix-action@v16p
      #        with:
      #          name: devenv
      - name: Cache Nix Store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: devenv-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/devenv.lock') }}
          restore-prefixes-first-match: devenv-${{ runner.os }}-
          gc-max-store-size-linux: 3000000000
      - name: Install devenv.sh
        shell: bash
        run: nix profile add nixpkgs#devenv
      - name: Download trained model
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh release download log_reg_window-v1 --pattern '*.model' --dir .
      - name: Run inference
        env:
          API_NINJAS_KEY: ${{ secrets.APININJAS }}
          PYTHONPATH: src
        run: |
          mkdir -p predictions
          python src/models/inference_window_model.py \
          --model log_reg_window_trained.model \
          --output "predictions/$(date +%F).csv"
      - name: Upload predictions as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: predictions-${{ github.run_id }}
          path: predictions/*.csv
          retention-days: 90
