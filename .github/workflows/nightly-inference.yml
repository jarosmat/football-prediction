name: nightly-inference

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict:
    environment: inference
    defaults:
      run:
        shell: devenv shell -- bash -e {0}
    env:
      PREDICTION_FILE: "predictions/$(date +%F).csv"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: football-prediction
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv
        shell: bash
      - name: Download trained model
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh release download log_reg_window-v1 --pattern '*.model' --dir .

      - name: Run inference
        env:
          API_NINJAS_KEY: ${{ secrets.APININJAS }}
          PYTHONPATH: src
        run: |
          mkdir -p predictions
          python src/models/inference_window_model.py \
            --model log_reg_window_trained.model \
            --output ${{ env.PREDICTION_FILE }}

      - name: Write predictions to docs
        env:
          API_NINJAS_KEY: ${{ secrets.APININJAS }}
          PYTHONPATH: src
        run: [ -f ${{ env.PREDICTION_FILE }} ] && python write_pred.py --predictions ${{ env.PREDICTION_FILE }} --dest docs/Predictions.md || echo "Could not find predictions file, skipping"

      - name: Upload predictions as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: predictions-${{ github.run_id }}
          path: predictions/*.csv
          retention-days: 90

      - name: Commit predictions to docs
        run: |
          git config user.name ${{ github.actor }}
          git add docs/Predictions.md
          git diff-index --quiet HEAD || (git commit -m "Update predictions [skip ci]" && git push origin HEAD:master)
